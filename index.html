<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لجنة الأدوية المزمنة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f5;--card:#fff;--ink:#16302b;--mute:#5d726d;--line:#d5e2de;--main:#0e6b5c;--main-ink:#fff;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a18;--card:#172623;--ink:#e6f1ee;--mute:#9bb2ad;--line:#2a3e3a;--main:#3fb5a0;--main-ink:#08211c;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:17px;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 16px}
h2{font-size:1.1rem;margin:0 0 4px}
.acts{display:flex;gap:6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:500;margin:10px 0 4px}
input,textarea{width:100%;padding:11px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
button{font:inherit;font-weight:700;padding:11px 16px;border:0;border-radius:8px;background:var(--main);color:var(--main-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--main);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.bar{display:flex;gap:8px;justify-content:space-between;align-items:center}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.row b{display:block}.row small{color:var(--mute)}
.err{color:var(--bad);min-height:1.6em;margin:8px 0 0}
.empty{color:var(--mute);text-align:center;padding:18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>

<section id="login" hidden>
  <h1>لجنة الأدوية المزمنة</h1>
  <div class="box">
    <label for="em">البريد الإلكتروني</label>
    <input id="em" type="email" autocomplete="username" dir="ltr">
    <label for="pw">كلمة السر</label>
    <input id="pw" type="password" autocomplete="current-password" dir="ltr">
    <p class="err" id="lerr"></p>
    <button id="btnLogin">دخول</button>
  </div>
</section>

<section id="app" hidden>
  <div class="bar">
    <h1>المستفيدون</h1>
    <button class="ghost" id="btnOut">خروج</button>
  </div>
  <div class="box">
    <label for="nm">الاسم</label>
    <input id="nm">
    <label for="ph">الهاتف</label>
    <input id="ph" type="tel" dir="ltr">
    <label for="nt">ملاحظات</label>
    <textarea id="nt" rows="2"></textarea>
    <p class="err" id="aerr"></p>
    <button id="btnAdd">إضافة مستفيد</button>
  </div>
  <div id="list"></div>
</section>

<section id="detail" hidden>
  <div class="bar">
    <h1 id="dname"></h1>
    <button class="ghost" id="btnBack">رجوع</button>
  </div>
  <div class="box">
    <h2>الأدوية الشهرية</h2>
    <label for="dn">الدواء</label>
    <input id="dn">
    <label for="dq">الكمية الشهرية</label>
    <input id="dq">
    <p class="err" id="derr"></p>
    <button id="btnDrug">إضافة دواء</button>
  </div>
  <div id="drugs"></div>
  <div class="box">
    <h2>الشراء الشهري</h2>
    <label for="pm">الشهر</label>
    <input id="pm" type="month" dir="ltr">
    <label for="pt">المبلغ الإجمالي</label>
    <input id="pt" type="number" inputmode="decimal" dir="ltr">
    <p class="err" id="perr"></p>
    <button id="btnBuy">تسجيل شراء</button>
  </div>
  <div id="buys"></div>
</section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ضع إعدادات مشروعك من Firebase Console هنا
const firebaseConfig = {
  apiKey: "AIzaSyA3F6-j98wJi456ie9EDY0hG1Q712ilxvs",
  authDomain: "lejna-9894b.firebaseapp.com",
  projectId: "lejna-9894b",
  appId: "1:746554897524:web:2421c191f5cdbd88cf0d21"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const $ = id => document.getElementById(id);
let unsub = null;

auth.onAuthStateChanged(user => {
  $('login').hidden = !!user;
  $('app').hidden = !user;
  $('detail').hidden = true;
  stopDetail();
  if (unsub) { unsub(); unsub = null; }
  if (user) listen();
});

$('btnLogin').onclick = async () => {
  $('lerr').textContent = '';
  try {
    await auth.signInWithEmailAndPassword($('em').value.trim(), $('pw').value);
  } catch (e) {
    $('lerr').textContent = 'البريد أو كلمة السر غير صحيحة.';
  }
};
$('btnOut').onclick = () => auth.signOut();

$('btnAdd').onclick = async () => {
  const name = $('nm').value.trim();
  $('aerr').textContent = '';
  if (!name) { $('aerr').textContent = 'اكتب اسم المستفيد أولاً.'; return; }
  try {
    await db.collection('beneficiaries').add({
      name,
      phone: $('ph').value.trim(),
      notes: $('nt').value.trim(),
      active: true,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    $('nm').value = $('ph').value = $('nt').value = '';
  } catch (e) {
    $('aerr').textContent = 'تعذّر الحفظ. تحقق من الاتصال والصلاحيات.';
  }
};

let cur = null, unD = [];
function stopDetail() { unD.forEach(f => f()); unD = []; cur = null; }

function btn(label, fn) {
  const b = document.createElement('button');
  b.className = 'ghost';
  b.textContent = label;
  b.onclick = fn;
  return b;
}
function row(title, sub, actions) {
  const box = document.createElement('div');
  box.className = 'box row';
  const info = document.createElement('div');
  const b = document.createElement('b');
  b.textContent = title;
  const s = document.createElement('small');
  s.textContent = sub;
  info.append(b, s);
  const acts = document.createElement('div');
  acts.className = 'acts';
  actions.forEach(a => acts.appendChild(a));
  box.append(info, acts);
  return box;
}
function emptyMsg(t) {
  const p = document.createElement('p');
  p.className = 'empty';
  p.textContent = t;
  return p;
}

function openDetail(id, name) {
  stopDetail();
  cur = id;
  $('app').hidden = true;
  $('detail').hidden = false;
  $('dname').textContent = name;
  $('pm').value = new Date().toISOString().slice(0, 7);
  window.scrollTo(0, 0);

  unD.push(db.collection('medications').where('beneficiaryId', '==', id).onSnapshot(snap => {
    const L = $('drugs');
    L.textContent = '';
    if (snap.empty) { L.appendChild(emptyMsg('لا توجد أدوية مسجلة بعد.')); return; }
    snap.forEach(doc => {
      const d = doc.data();
      L.appendChild(row(d.drugName, 'الكمية الشهرية: ' + (d.monthlyQty || '-'), [
        btn('حذف', () => { if (confirm('حذف ' + d.drugName + '؟')) doc.ref.delete(); })
      ]));
    });
  }));

  unD.push(db.collection('purchases').where('beneficiaryId', '==', id).onSnapshot(snap => {
    const L = $('buys');
    L.textContent = '';
    const rows = snap.docs.map(x => ({ ref: x.ref, ...x.data() }))
      .sort((a, b) => b.month.localeCompare(a.month));
    if (!rows.length) { L.appendChild(emptyMsg('لا توجد مشتريات مسجلة بعد.')); return; }
    rows.forEach(p => {
      const done = !!p.deliveredAt;
      L.appendChild(row(p.month + ' - ' + p.total, done ? 'تم التسليم' : 'لم يُسلَّم بعد', [
        btn(done ? 'إلغاء التسليم' : 'تم التسليم', () =>
          p.ref.update({ deliveredAt: done ? null : firebase.firestore.FieldValue.serverTimestamp() })),
        btn('حذف', () => { if (confirm('حذف هذا السجل؟')) p.ref.delete(); })
      ]));
    });
  }));
}

$('btnBack').onclick = () => {
  stopDetail();
  $('detail').hidden = true;
  $('app').hidden = false;
};

$('btnDrug').onclick = async () => {
  const drugName = $('dn').value.trim();
  $('derr').textContent = '';
  if (!drugName) { $('derr').textContent = 'اكتب اسم الدواء أولاً.'; return; }
  try {
    await db.collection('medications').add({
      beneficiaryId: cur,
      drugName,
      monthlyQty: $('dq').value.trim(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    $('dn').value = $('dq').value = '';
  } catch (e) {
    $('derr').textContent = 'تعذّر الحفظ. تحقق من الاتصال.';
  }
};

$('btnBuy').onclick = async () => {
  const month = $('pm').value;
  const total = parseFloat($('pt').value);
  $('perr').textContent = '';
  if (!month || isNaN(total)) { $('perr').textContent = 'اختر الشهر واكتب المبلغ.'; return; }
  try {
    await db.collection('purchases').add({
      beneficiaryId: cur,
      month,
      total,
      deliveredAt: null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    $('pt').value = '';
  } catch (e) {
    $('perr').textContent = 'تعذّر الحفظ. تحقق من الاتصال.';
  }
};

function listen() {
  unsub = db.collection('beneficiaries').orderBy('name').onSnapshot(snap => {
    const list = $('list');
    list.textContent = '';
    if (snap.empty) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'لا يوجد مستفيدون بعد. أضف أول مستفيد من النموذج أعلاه.';
      list.appendChild(p);
      return;
    }
    snap.forEach(doc => {
      const d = doc.data();
      const box = document.createElement('div');
      box.className = 'box row';
      const info = document.createElement('div');
      const b = document.createElement('b');
      b.textContent = d.name;
      const s = document.createElement('small');
      s.textContent = [d.phone, d.notes].filter(Boolean).join(' - ');
      info.append(b, s);
      const del = document.createElement('button');
      del.className = 'ghost';
      del.textContent = 'حذف';
      del.onclick = () => {
        if (confirm('حذف ' + d.name + '؟')) doc.ref.delete();
      };
      const open = document.createElement('button');
      open.textContent = 'فتح';
      open.onclick = () => openDetail(doc.id, d.name);
      const acts = document.createElement('div');
      acts.className = 'acts';
      acts.append(open, del);
      box.append(info, acts);
      list.appendChild(box);
    });
  }, () => {
    $('list').textContent = 'تعذّر تحميل القائمة.';
  });
}
</script>
</body>
</html>
