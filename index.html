<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لجنة الأدوية المزمنة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f5;--card:#fff;--ink:#16302b;--mute:#5d726d;--line:#d5e2de;--main:#0e6b5c;--main-ink:#fff;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a18;--card:#172623;--ink:#e6f1ee;--mute:#9bb2ad;--line:#2a3e3a;--main:#3fb5a0;--main-ink:#08211c;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:17px;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 16px}
h2{font-size:1.1rem;margin:0 0 8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:500;margin:10px 0 4px}
input,textarea{width:100%;padding:11px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
button{font:inherit;font-weight:700;padding:11px 16px;border:0;border-radius:8px;background:var(--main);color:var(--main-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--main);border:1px solid var(--line)}
button.sm{padding:6px 10px;font-size:.9rem}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.bar,.row,.srow{display:flex;justify-content:space-between;gap:8px;align-items:center}
.row b{display:block}.row small{color:var(--mute)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.srow{padding:8px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.err{color:var(--bad);min-height:1.6em;margin:8px 0 0}
.empty{color:var(--mute);text-align:center;padding:12px}
.ok{color:var(--main);font-weight:700}.bad{color:var(--bad);font-weight:700}
.sum{font-weight:700;margin:0 0 10px}
.tw{overflow-x:auto;margin-bottom:8px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 4px;border-top:1px solid var(--line);text-align:start;font-size:.95rem}
thead th{border-top:0;color:var(--mute);font-weight:500}
tfoot th{font-weight:700}
.num{direction:ltr;text-align:end}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;background:transparent;color:var(--main);border:1px solid var(--line)}
.tabs button[aria-selected=true]{background:var(--main);color:var(--main-ink);border-color:var(--main)}
h3{font-size:1rem;margin:14px 0 4px}
#rbody{background:#fff;color:#000;padding:6px;border-radius:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.sheet{border-collapse:collapse;width:100%}
table.sheet td{border:1px solid #000;padding:6px 4px;text-align:center;font-weight:700}
body.viewer .edit-only,body.viewer .admin-only{display:none!important}
[hidden]{display:none!important}
@media print{
:root{--bg:#fff;--card:#fff;--ink:#000;--mute:#333;--line:#999;--main:#000;--bad:#000}
body{background:#fff;font-size:13pt}
main{max-width:none;padding:0}
.noprint{display:none!important}
h2,h3{break-after:avoid}
tr{break-inside:avoid}
}
</style>
</head>
<body class="viewer">
<main>

<section id="login" hidden>
  <h1>لجنة الأدوية المزمنة</h1>
  <div class="box">
    <label for="em">البريد الإلكتروني</label>
    <input id="em" type="email" autocomplete="username" dir="ltr">
    <label for="pw">كلمة السر</label>
    <input id="pw" type="password" autocomplete="current-password" dir="ltr">
    <p class="err" id="lerr"></p>
    <div class="acts"><button id="btnLogin">دخول</button><button class="ghost" id="btnLoginBack">رجوع</button></div>
  </div>
</section>

<section id="app" hidden>
  <div class="bar">
    <h1>لجنة الأدوية المزمنة</h1>
    <button class="ghost" id="btnOut" hidden>خروج</button>
    <button class="ghost" id="btnShowLogin">دخول المشرف</button>
  </div>

  <div class="box">
    <label for="sm">الشهر</label>
    <input id="sm" type="month" dir="ltr">
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-don" aria-selected="true">المتبرعون</button>
    <button role="tab" id="tab-acc" aria-selected="false">الحساب</button>
    <button role="tab" id="tab-ben" class="admin-only" aria-selected="false">المستفيدون</button>
  </nav>

  <div id="pane-don">
  <div class="box">
    <h2>المتبرعون</h2>
    <div class="tw"><table>
      <thead><tr><th>الاسم</th><th>المبلغ</th><th></th></tr></thead>
      <tbody id="dtb"></tbody>
      <tfoot><tr><th>المجموع</th><th class="num" id="dtot"></th><th></th></tr></tfoot>
    </table></div>
    <div class="edit-only">
    <label for="dn">اسم المتبرع</label>
    <input id="dn">
    <label for="da">المبلغ</label>
    <input id="da" type="number" inputmode="decimal" dir="ltr">
    <p class="err" id="derr"></p>
    <button id="btnDon">إضافة متبرع</button>
    </div>
  </div>
  </div>

  <div id="pane-acc" hidden>
  <div class="box">
    <h2>الصيدليات</h2>
    <div class="tw"><table>
      <thead><tr><th>الصيدلية</th><th>المبلغ</th><th></th></tr></thead>
      <tbody id="ptb"></tbody>
      <tfoot><tr><th>المجموع</th><th class="num" id="ptot"></th><th></th></tr></tfoot>
    </table></div>
    <div class="edit-only">
    <label for="pn">اسم الصيدلية</label>
    <input id="pn">
    <label for="pa">المبلغ المدفوع</label>
    <input id="pa" type="number" inputmode="decimal" dir="ltr">
    <p class="err" id="perr"></p>
    <button id="btnPh">إضافة صيدلية</button>
    </div>
  </div>
  <div class="box">
    <h2>الحساب</h2>
    <div class="srow"><span>مجموع التبرعات</span><b id="s1"></b></div>
    <div class="srow"><span>المدفوع للصيدليات</span><b id="s2"></b></div>
    <div class="srow"><span>الباقي</span><b id="s3"></b></div>
    <div class="srow admin-only"><span>قيمة أدوية المستفيدين المسجلة</span><b id="s5"></b></div>
    <small id="s4" class="bad"></small>
  </div>
  <button id="btnReport">تقرير الشهر (PDF)</button>
  </div>

  <div id="pane-ben" class="admin-only" hidden>
  <div class="box">
    <h2>المستفيدون</h2>
    <div class="edit-only">
    <label for="nm">الاسم</label>
    <input id="nm">
    <label for="nt">ملاحظات</label>
    <textarea id="nt" rows="2"></textarea>
    <p class="err" id="aerr"></p>
    <button id="btnAdd">إضافة مستفيد</button>
    </div>
  </div>
  <div id="blist"></div>
  </div>
</section>

<section id="report" hidden>
  <div class="bar noprint">
    <button class="ghost" id="btnRBack">رجوع</button>
    <button id="btnPrint">طباعة / حفظ PDF</button>
  </div>
  <div id="rbody"></div>
</section>

<section id="detail" hidden>
  <div class="bar">
    <h1 id="dname"></h1>
    <button class="ghost" id="btnBack">رجوع</button>
  </div>
  <p class="sum" id="dmonth"></p>
  <div class="box">
    <h2>الأدوية</h2>
    <div class="tw"><table>
      <thead><tr><th>الدواء</th><th>الكمية</th><th>السعر</th><th>المجموع</th><th></th></tr></thead>
      <tbody id="mtb"></tbody>
      <tfoot><tr><th colspan="3">مجموع الأدوية</th><th class="num" id="mtot"></th><th></th></tr></tfoot>
    </table></div>
    <div class="edit-only">
    <label for="mn">اسم الدواء</label>
    <input id="mn">
    <label for="mq">الكمية</label>
    <input id="mq" type="number" inputmode="numeric" dir="ltr">
    <label for="mp">سعر الوحدة</label>
    <input id="mp" type="number" inputmode="decimal" dir="ltr">
    <p class="err" id="merr"></p>
    <button id="btnMed">إضافة دواء</button>
    </div>
  </div>
</section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA3F6-j98wJi456ie9EDY0hG1Q712ilxvs",
  authDomain: "lejna-9894b.firebaseapp.com",
  projectId: "lejna-9894b",
  appId: "1:746554897524:web:2421c191f5cdbd88cf0d21"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
const $ = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString('en');
const stamp = () => firebase.firestore.FieldValue.serverTimestamp();
const lineTotal = m => (Number(m.qty) || 0) * (Number(m.price) || 0);
const sumMeds = a => a.reduce((t, x) => t + lineTotal(x), 0);
const month = () => $('sm').value;
let bens = [], donors = [], meds = [], pharms = [], cur = null, unsub = [], unM = [];

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
function btn(label, fn, cls) { const b = el('button', label, cls || 'ghost sm'); b.onclick = fn; return b; }
function td(c, cls) {
  const x = el('td', typeof c === 'string' ? c : undefined, cls);
  if (typeof c !== 'string') x.appendChild(c);
  return x;
}
const DF = [{ key: 'name', label: 'اسم المتبرع', req: true }, { key: 'amount', label: 'المبلغ', num: true }];
const PF = [{ key: 'name', label: 'اسم الصيدلية', req: true }, { key: 'amount', label: 'المبلغ المدفوع', num: true }];
const BF = [{ key: 'name', label: 'اسم المستفيد', req: true }, { key: 'notes', label: 'ملاحظات' }];
const MF = [{ key: 'drugName', label: 'اسم الدواء', req: true }, { key: 'qty', label: 'الكمية', num: true, pos: true }, { key: 'price', label: 'سعر الوحدة', num: true }];

async function edit(ref, d, fields) {
  const upd = {};
  for (const f of fields) {
    const v = prompt(f.label, d[f.key] ?? '');
    if (v === null) return;
    const t = v.trim();
    if (f.num) {
      const n = parseFloat(t);
      if (isNaN(n) || (f.pos && n <= 0)) { alert('قيمة غير صالحة.'); return; }
      upd[f.key] = n;
    } else {
      if (f.req && !t) { alert('هذا الحقل مطلوب.'); return; }
      upd[f.key] = t;
    }
  }
  try { await ref.update(upd); } catch (e) { alert('تعذّر الحفظ. تحقق من الاتصال.'); }
}
function actCell(...btns) { const d = el('div', undefined, 'acts edit-only'); btns.forEach(b => d.appendChild(b)); return d; }

function tr(...cells) { const r = el('tr'); cells.forEach(c => r.appendChild(c)); return r; }

function showTab(t) {
  ['don', 'acc', 'ben'].forEach(k => {
    $('pane-' + k).hidden = k !== t;
    $('tab-' + k).setAttribute('aria-selected', k === t);
  });
}
['don', 'acc', 'ben'].forEach(k => { $('tab-' + k).onclick = () => showTab(k); });

/* الدخول */
let adminMode = false;
auth.onAuthStateChanged(user => {
  stop();
  $('login').hidden = true;
  $('detail').hidden = true;
  $('report').hidden = true;
  $('app').hidden = false;
  $('btnOut').hidden = !user;
  $('btnShowLogin').hidden = !!user;
  start(user);
});
$('btnShowLogin').onclick = () => { $('app').hidden = true; $('login').hidden = false; };
$('btnLoginBack').onclick = () => { $('login').hidden = true; $('app').hidden = false; };
$('btnLogin').onclick = async () => {
  $('lerr').textContent = '';
  try { await auth.signInWithEmailAndPassword($('em').value.trim(), $('pw').value); }
  catch (e) { $('lerr').textContent = 'البريد أو كلمة السر غير صحيحة.'; }
};
$('btnOut').onclick = () => auth.signOut();

function stop() {
  unsub.forEach(f => f()); unM.forEach(f => f());
  unsub = []; unM = []; cur = null;
  bens = []; donors = []; meds = []; pharms = [];
}
async function start(user) {
  let admin = false;
  if (user) {
    try {
      const r = await db.collection('users').doc((user.email || '').toLowerCase()).get();
      admin = r.exists && r.data().role === 'admin';
    } catch (e) { admin = false; }
    if (!auth.currentUser || auth.currentUser.uid !== user.uid) return;
  }
  adminMode = admin;
  document.body.classList.toggle('viewer', !admin);
  if (!admin) showTab('don');
  if (!month()) $('sm').value = new Date().toISOString().slice(0, 7);
  if (admin) unsub.push(db.collection('beneficiaries').orderBy('name').onSnapshot(s => {
    bens = s.docs.map(d => ({ id: d.id, ref: d.ref, ...d.data() }));
    render();
  }, () => { $('blist').textContent = 'تعذّر تحميل المستفيدين.'; }));
  watchMonth();
}
function watchMonth() {
  unM.forEach(f => f()); unM = []; donors = []; meds = []; pharms = [];
  render();
  const m = month();
  if (!m) return;
  unM.push(db.collection('donations').where('month', '==', m).onSnapshot(s => {
    donors = s.docs.map(d => ({ ref: d.ref, ...d.data() }))
      .sort((a, b) => (a.createdAt?.seconds || 1e12) - (b.createdAt?.seconds || 1e12));
    render();
  }));
  if (adminMode) unM.push(db.collection('medications').where('month', '==', m).onSnapshot(s => {
    meds = s.docs.map(d => ({ ref: d.ref, ...d.data() }));
    render();
  }));
  unM.push(db.collection('pharmacies').where('month', '==', m).onSnapshot(s => {
    pharms = s.docs.map(d => ({ ref: d.ref, ...d.data() }))
      .sort((a, b) => (a.createdAt?.seconds || 1e12) - (b.createdAt?.seconds || 1e12));
    render();
  }));
}
$('sm').onchange = watchMonth;

/* العرض */
function render() {
  const D = donors.reduce((t, x) => t + (Number(x.amount) || 0), 0);
  const M = sumMeds(meds);
  const P = pharms.reduce((t, x) => t + (Number(x.amount) || 0), 0);

  const T = $('dtb'); T.textContent = '';
  donors.forEach(d => T.appendChild(tr(
    td(d.name), td(fmt(d.amount), 'num'),
    td(actCell(btn('تعديل', () => edit(d.ref, d, DF)), btn('حذف', () => { if (confirm('حذف ' + d.name + '؟')) d.ref.delete(); })))
  )));
  if (!donors.length) T.appendChild(tr(td('لا يوجد متبرعون في هذا الشهر.')));
  $('dtot').textContent = fmt(D);

  const PT = $('ptb'); PT.textContent = '';
  pharms.forEach(p => PT.appendChild(tr(
    td(p.name), td(fmt(p.amount), 'num'),
    td(actCell(btn('تعديل', () => edit(p.ref, p, PF)), btn('حذف', () => { if (confirm('حذف ' + p.name + '؟')) p.ref.delete(); })))
  )));
  if (!pharms.length) PT.appendChild(tr(td('لم تُسجَّل صيدليات في هذا الشهر.')));
  $('ptot').textContent = fmt(P);

  const R = D - P;
  $('s1').textContent = fmt(D);
  $('s2').textContent = fmt(P);
  $('s5').textContent = fmt(M);
  $('s3').textContent = fmt(R);
  $('s3').className = R < 0 ? 'bad' : 'ok';
  $('s4').textContent = R < 0 ? 'عجز هذا الشهر، يُغطّى من فائض اللجنة.' : '';

  const L = $('blist'); L.textContent = '';
  if (!bens.length) L.appendChild(el('p', 'لا يوجد مستفيدون بعد. أضف أول مستفيد.', 'empty'));
  bens.forEach(b => {
    const mine = meds.filter(x => x.beneficiaryId === b.id);
    const info = el('div');
    info.append(el('b', b.name), el('small', [b.notes, mine.length ? mine.length + ' دواء - ' + fmt(sumMeds(mine)) : 'لا أدوية هذا الشهر'].filter(Boolean).join(' - ')));
    const acts = el('div', undefined, 'acts');
    acts.append(btn('فتح', () => openDetail(b.id), 'sm'), btn('تعديل', () => edit(b.ref, b, BF), 'ghost sm edit-only'),
      btn('حذف', () => { if (confirm('حذف ' + b.name + '؟')) b.ref.delete(); }, 'ghost sm edit-only'));
    const box = el('div', undefined, 'box row');
    box.append(info, acts);
    L.appendChild(box);
  });
  if (cur) renderDetail();
}

function openDetail(id) {
  cur = id;
  $('app').hidden = true;
  $('detail').hidden = false;
  window.scrollTo(0, 0);
  renderDetail();
}
function back() { cur = null; $('detail').hidden = true; $('app').hidden = false; showTab('ben'); }
$('btnBack').onclick = back;

function renderDetail() {
  const b = bens.find(x => x.id === cur);
  if (!b) { back(); return; }
  $('dname').textContent = b.name;
  $('dmonth').textContent = 'الشهر: ' + month();
  const mine = meds.filter(x => x.beneficiaryId === cur);
  const T = $('mtb'); T.textContent = '';
  mine.forEach(m => T.appendChild(tr(
    td(m.drugName), td(String(m.qty), 'num'), td(fmt(m.price), 'num'), td(fmt(lineTotal(m)), 'num'),
    td(actCell(btn('تعديل', () => edit(m.ref, m, MF)), btn('حذف', () => { if (confirm('حذف ' + m.drugName + '؟')) m.ref.delete(); })))
  )));
  if (!mine.length) T.appendChild(tr(td('لا توجد أدوية لهذا الشهر.')));
  $('mtot').textContent = fmt(sumMeds(mine));
}

/* التقرير */
const sumAmt = a => a.reduce((t, x) => t + (Number(x.amount) || 0), 0);
const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'ماي', 'يونيو', 'يوليو', 'أغشت', 'شتمبر', 'أكتوبر', 'نوفمبر', 'دجمبر'];
const PCOL = ['#e6a0e0', '#f4b183', '#b4c6e7', '#ffe699', '#c5e0b4'];
const plain = n => String(Number(n) || 0);
function cell(text, bg, o = {}) {
  const c = el('td', text, o.num ? 'num' : undefined);
  c.style.background = bg;
  if (o.color) c.style.color = o.color;
  if (o.span) c.colSpan = o.span;
  if (o.big) c.style.fontSize = '1.25rem';
  if (o.h) c.style.height = o.h;
  return c;
}
function buildReport() {
  const R = $('rbody'); R.textContent = '';
  const D = sumAmt(donors), P = sumAmt(pharms), rem = D - P;
  const mi = parseInt(month().slice(5, 7), 10) - 1;
  const half = Math.ceil(donors.length / 2);
  const right = donors.slice(0, half), left = donors.slice(half);
  const GREEN = '#92d050', YEL = '#ffff00', ORG = '#ed7d31', GOLD = '#ffc000', PUR = '#7030a0', BLUE = '#00b0f0', W = '#fff';
  const t = el('table', undefined, 'sheet');

  t.appendChild(tr(cell('تبرعات شهر ' + (MONTHS[mi] || month()), '#4ea72e', { span: 4 })));
  t.appendChild(tr(cell('', W, { span: 4 })));
  t.appendChild(tr(cell('الاسم', GOLD), cell('المبلغ', PUR, { color: W }), cell('الاسم', GOLD), cell('المبلغ', PUR, { color: W })));
  for (let i = 0; i < half; i++) {
    const a = right[i], b = left[i];
    t.appendChild(tr(
      cell(a ? a.name : '', W), cell(a ? plain(a.amount) : '', W, { num: true }),
      cell(b ? b.name : '', W), cell(b ? plain(b.amount) : '', W, { num: true })
    ));
  }
  t.appendChild(tr(cell('المجموع', YEL), cell(plain(sumAmt(right)), ORG, { num: true }),
    cell('المجموع', YEL), cell(plain(sumAmt(left)), ORG, { num: true })));

  const line = (label, value, lbg, vbg) =>
    t.appendChild(tr(cell(label, lbg), cell(plain(value), vbg, { span: 3, num: true })));
  line('مجموع التبرعات', D, YEL, GREEN);
  pharms.forEach((p, i) => line(p.name, p.amount, PCOL[i % PCOL.length], PCOL[i % PCOL.length]));
  line('المبلغ المدفوع', P, '#c5e5f5', '#c5e5f5');
  line('الباقي بعد العملية', rem, YEL, GREEN);

  t.appendChild(tr(cell('لقد تمت العملية بنجاح والحمد لله من قبل ومن بعد', BLUE, { span: 4 })));
  if (rem < 0) t.appendChild(tr(cell('ملاحظة: لقد تم تسديد المبلغ الباقي من الفائض المالي الموجود عند اللجنة',
    BLUE, { span: 4, color: YEL, big: true, h: '90px' })));
  R.appendChild(t);
}
$('btnReport').onclick = () => { buildReport(); $('app').hidden = true; $('report').hidden = false; window.scrollTo(0, 0); };
$('btnRBack').onclick = () => { $('report').hidden = true; $('app').hidden = false; };
$('btnPrint').onclick = () => window.print();

/* الإضافة */
$('btnDon').onclick = async () => {
  const name = $('dn').value.trim(), amount = parseFloat($('da').value);
  $('derr').textContent = '';
  if (!name || isNaN(amount)) { $('derr').textContent = 'اكتب اسم المتبرع والمبلغ.'; return; }
  try {
    await db.collection('donations').add({ month: month(), name, amount, createdAt: stamp() });
    $('dn').value = $('da').value = '';
    $('dn').focus();
  } catch (e) { $('derr').textContent = 'تعذّر الحفظ. تحقق من الاتصال.'; }
};

$('btnPh').onclick = async () => {
  const name = $('pn').value.trim(), amount = parseFloat($('pa').value);
  $('perr').textContent = '';
  if (!name || isNaN(amount)) { $('perr').textContent = 'اكتب اسم الصيدلية والمبلغ.'; return; }
  try {
    await db.collection('pharmacies').add({ month: month(), name, amount, createdAt: stamp() });
    $('pn').value = $('pa').value = '';
    $('pn').focus();
  } catch (e) { $('perr').textContent = 'تعذّر الحفظ. تحقق من الاتصال.'; }
};

$('btnAdd').onclick = async () => {
  const name = $('nm').value.trim();
  $('aerr').textContent = '';
  if (!name) { $('aerr').textContent = 'اكتب اسم المستفيد أولاً.'; return; }
  try {
    await db.collection('beneficiaries').add({ name, notes: $('nt').value.trim(), active: true, createdAt: stamp() });
    $('nm').value = $('nt').value = '';
  } catch (e) { $('aerr').textContent = 'تعذّر الحفظ. تحقق من الاتصال.'; }
};

$('btnMed').onclick = async () => {
  const drugName = $('mn').value.trim(), qty = parseFloat($('mq').value), price = parseFloat($('mp').value);
  $('merr').textContent = '';
  if (!drugName || !(qty > 0) || isNaN(price)) { $('merr').textContent = 'اكتب اسم الدواء والكمية والسعر.'; return; }
  try {
    await db.collection('medications').add({ beneficiaryId: cur, month: month(), drugName, qty, price, createdAt: stamp() });
    $('mn').value = $('mq').value = $('mp').value = '';
    $('mn').focus();
  } catch (e) { $('merr').textContent = 'تعذّر الحفظ. تحقق من الاتصال.'; }
};
</script>
